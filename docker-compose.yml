version: '3.8'
services:
  expo-app:
    build: .
    ports:
      - "8081:8081"
      - "19000:19000"
      - "19001:19001"
      - "19002:19002"
    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - HOST=0.0.0.0
    stdin_open: true
    tty: true
    command: npx expo start --tunnel --non-interactive

